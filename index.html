<html>
<head>
    <title>DroidStore - Главная</title>
</head>
<body bgcolor="#121212" text="#ffffff">

    <table width="100%" border="0" cellpadding="10" cellspacing="0" bgcolor="#1f1f1f">
        <tr>
            <td align="left">
                <font color="#4CAF50" size="5"><b>🤖 DroidStore</b></font>
            </td>
            <td align="right" id="authCell">
                <a href="login.html"><font color="#4CAF50">Войти</font></a> | 
                <a href="reg.html"><font color="#4CAF50">Зарегистрироваться</font></a>
            </td>
        </tr>
    </table>

    <div align="center">
        <h2>Добро пожаловать в DroidStore!</h2>
        <p>Каталог приложений для всех версий Android.</p>
        
        <br>
        <hr width="80%" color="#333">
        <h3>Каталог приложений</h3>
        <p><font size="2" color="#aaa">Автоматическое обновление списка из хранилища</font></p>

        <table border="0" cellpadding="8" cellspacing="0" width="85%" bgcolor="#1a1a1a" style="border: 1px solid #333;" id="appsTable">
            <tr bgcolor="#222">
                <td align="left"><font size="2"><b>Приложение</b></font></td>
                <td align="center"><font size="2"><b>Размер</b></font></td>
                <td align="center"><font size="2"><b>Скачать</b></font></td>
            </tr>
            <tr>
                <td colspan="3" align="center"><font size="2" color="#aaa">Загрузка списка...</font></td>
            </tr>
        </table>
    </div>

    <script language="JavaScript">
        var currentUser = null;
        try {
            if (typeof localStorage !== 'undefined') {
                var userData = localStorage.getItem('droidstore_user');
                if (userData) {
                    currentUser = JSON.parse(userData);
                }
            }
        } catch(e) {}

        var authCell = document.getElementById('authCell');

        if (currentUser) {
            var rank = currentUser.rank || (currentUser.id == 1 ? "Главный разработчик" : "Новичок");
            var color = currentUser.color || (currentUser.id == 1 ? "#4CAF50" : "#aaaaaa");

            authCell.innerHTML = '<table border="0" cellspacing="0" cellpadding="0"><tr>' +
                '<td><a href="profile.html"><img src="' + (currentUser.avatar || '') + '" width="32" height="32" style="border: 2px solid ' + color + ';"></a></td>' +
                '<td style="padding-left: 8px;" align="left">' +
                '<a href="profile.html" style="text-decoration: none;"><font size="2" color="#ffffff"><b>' + currentUser.name + '</b></font></a><br>' +
                '<font size="1" color="' + color + '">' + rank + '</font>' +
                '</td>' +
                '<td style="padding-left: 10px;"><a href="#" onclick="logout(); return false;"><font color="#ff5555">Выйти</font></a></td>' +
                '</tr></table>';
        } else {
            authCell.innerHTML = '<a href="login.html"><font color="#4CAF50">Войти</font></a> | ' +
                                 '<a href="reg.html"><font color="#4CAF50">Зарегистрироваться</font></a>';
        }

        function logout() {
            try {
                localStorage.removeItem('droidstore_user');
            } catch(e) {}
            window.location.reload();
        }

        function loadApps() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "api/get_apps.php", true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState == 4 && xhr.status == 200) {
                    try {
                        var apps = JSON.parse(xhr.responseText);
                        var table = document.getElementById('appsTable');
                        var html = '<tr bgcolor="#222"><td align="left"><font size="2"><b>Приложение</b></font></td><td align="center"><font size="2"><b>Размер</b></font></td><td align="center"><font size="2"><b>Скачать</b></font></td></tr>';
                        
                        if (apps.length === 0) {
                            html += '<tr><td colspan="3" align="center"><font size="2" color="#aaa">Нет доступных приложений</font></td></tr>';
                        } else {
                            for (var i = 0; i < apps.length; i++) {
                                html += '<tr>' +
                                    '<td align="left"><font size="2"><b>' + apps[i].name + '</b></font></td>' +
                                    '<td align="center"><font size="2">' + apps[i].size + '</font></td>' +
                                    '<td align="center"><a href="' + apps[i].url + '"><input type="button" value="Скачать" style="background: #4CAF50; color: white; border: none; padding: 4px 8px; cursor: pointer;"></a></td>' +
                                    '</tr>';
                            }
                        }
                        table.innerHTML = html;
                    } catch(e) {}
                }
            };
            xhr.send();
        }

        loadApps();
        setInterval(loadApps, 60000);
    </script>

</body>
</html>
