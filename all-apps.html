<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все приложения - DroidStore</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 16px;
        }
        h1, h2 {
            text-align: center;
            color: #4CAF50;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .app-item {
            background: #1e1e1e;
            padding: 12px 16px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .app-info {
            display: flex;
            flex-direction: column;
        }
        .app-name {
            font-size: 16px;
            font-weight: bold;
        }
        .app-details {
            font-size: 12px;
            color: #b0b0b0;
            margin-top: 4px;
        }
        .download-btn {
            background-color: #4CAF50;
            color: white;
            padding: 8px 14px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }
        .nav-links {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
        }
        .nav-links a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DroidStore</h1>

        <div class="nav-links">
            <a href="index.html">Главная</a>
            <a href="all-apps.html">Все приложения</a>
            <a href="profile.html">Профиль</a>
        </div>

        <h2>Каталог всех приложений</h2>
        <div id="all-apps-list"></div>
    </div>

    <script>
        function getAndroidVersionName(sdkInt) {
            const versions = {
                8: "Android 2.2 (Froyo)",
                10: "Android 2.3 (Gingerbread)",
                15: "Android 4.0 (ICS)",
                16: "Android 4.1 (Jelly Bean)",
                17: "Android 4.2 (Jelly Bean)",
                18: "Android 4.3 (Jelly Bean)",
                19: "Android 4.4 (KitKat)",
                21: "Android 5.0 (Lollipop)",
                22: "Android 5.1 (Lollipop)",
                23: "Android 6.0 (Marshmallow)",
                24: "Android 7.0 (Nougat)"
            };
            return versions[sdkInt] ? versions[sdkInt] + " (API " + sdkInt + ")" : "API " + sdkInt;
        }

        let apps = [
            { id: 1, name: "ES Explorer", sdk: 10, size: "15 МБ", file: "apk/es_explorer.apk" },
            { id: 2, name: "Opera Classic", sdk: 19, size: "12 МБ", file: "apk/opera_classic.apk" },
            { id: 3, name: "Lucky Patcher", sdk: 15, size: "8 МБ", file: "apk/lucky_patcher.apk" },
            { id: 4, name: "Telegram X", sdk: 16, size: "21 МБ", file: "apk/telegram_x.apk" },
            { id: 5, name: "MX Player", sdk: 15, size: "18 МБ", file: "apk/mx_player.apk" }
        ];

        const container = document.getElementById('all-apps-list');
        apps.forEach(app => {
            const androidVersion = getAndroidVersionName(app.sdk);
            const item = document.createElement('div');
            item.className = 'app-item';
            item.innerHTML = `
                <div class="app-info">
                    <span class="app-name">${app.name}</span>
                    <span class="app-details">${androidVersion} • ${app.size}</span>
                </div>
                <a href="${app.file}" class="download-btn" download>Скачать</a>
            `;
            container.appendChild(item);
        });
    </script>
</body>
</html>
